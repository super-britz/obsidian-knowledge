<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Transformer 简化流程</title>
  <desc id="desc">输入文字被编码成 token ID，变成含位置信息的向量，经过堆叠的 Transformer Block，再转成下一个 token 的概率。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 42px; font-weight: 700; fill: #111827; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
    .small { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 500; fill: #475569; }
  </style>
  <text x="600" y="70" text-anchor="middle" class="title">Transformer：先记住这条主干</text>
  <rect x="340" y="115" width="520" height="66" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="157" text-anchor="middle" class="label">输入文字</text>
  <line x1="600" y1="181" x2="600" y2="218" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="228" width="520" height="66" rx="13" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="600" y="270" text-anchor="middle" class="label">Token IDs</text>
  <line x1="600" y1="294" x2="600" y2="331" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="341" width="520" height="66" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="600" y="383" text-anchor="middle" class="label">Token 向量 + 位置信息</text>
  <line x1="600" y1="407" x2="600" y2="444" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="300" y="454" width="600" height="145" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="600" y="500" text-anchor="middle" class="label">Transformer Block × N 层</text><text x="600" y="540" text-anchor="middle" class="small">Attention 学习位置间的关系</text><text x="600" y="570" text-anchor="middle" class="small">LayerNorm、残差和 FFN 稳定并处理表示</text>
  <line x1="600" y1="599" x2="600" y2="636" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="646" width="520" height="66" rx="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="600" y="688" text-anchor="middle" class="label">词表 logits → 概率分布</text>
  <line x1="600" y1="712" x2="600" y2="749" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="340" y="759" width="520" height="66" rx="13" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="600" y="801" text-anchor="middle" class="label">选择或采样下一个 token</text>
  <text x="600" y="865" text-anchor="middle" class="small">各层结构相同，但参数通常独立。</text>
</svg>
